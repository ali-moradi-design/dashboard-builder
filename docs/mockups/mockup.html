<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Dashboard builder mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --radius: 10px;
  }
  [data-theme='dark'] {
    --bg: #2a2d2f;
    --surface: #393d3f;
    --surface-2: #43484a;
    --border: #50565a;
    --text: #fdfdff;
    --muted: #c6c5b9;
    --accent: #7fb0bc;
    --accent-fg: #2a2d2f;
    --accent-soft: rgba(127, 176, 188, 0.16);
    --grid: #4a5054;
    --s1: #7fb0bc; --s2: #c6c5b9; --s3: #8c9fb0; --s4: #d9e6e9; --s5: #5e98a6;
  }
  [data-theme='light'] {
    --bg: #fdfdff;
    --surface: #f4f4f1;
    --surface-2: #e9e9e3;
    --border: #d6d5cb;
    --text: #393d3f;
    --muted: #546a7b;
    --accent: #3f6f7a;
    --accent-fg: #fdfdff;
    --accent-soft: rgba(98, 146, 158, 0.16);
    --grid: #dddcd2;
    --s1: #4a7f8b; --s2: #8a887a; --s3: #546a7b; --s4: #2f5963; --s5: #6f8d9c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--bg); }
  #root { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 Inter, system-ui, sans-serif;
    width: 1440px;
    min-height: 960px;
    overflow: hidden;
  }
  [lang='fa'] body, [lang='fa'] { font-family: Vazirmatn, system-ui, sans-serif; }
  .app { display: grid; grid-template-rows: 60px 1fr; min-height: 960px; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding-inline: 20px;
    border-block-end: 1px solid var(--border);
    background: var(--surface);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .logo i { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
  .crumb { color: var(--muted); }
  .crumb b { color: var(--text); font-weight: 600; }
  .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding-inline: 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; font-weight: 500;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.icon { width: 34px; padding: 0; justify-content: center; }
  .btn.ghost { background: transparent; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg span { padding: 6px 10px; font-weight: 500; color: var(--muted); }
  .seg span.on { background: var(--accent-soft); color: var(--text); }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  main { display: grid; min-height: 0; }
  .canvas { padding: 20px; overflow: hidden; min-width: 0; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 54px; gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; display: flex; flex-direction: column; min-width: 0; position: relative;
  }
  .card h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .card h3 .more { margin-inline-start: auto; }
  .kpi .v { font-size: 30px; font-weight: 700; margin-block-start: 6px; letter-spacing: -0.01em; }
  [lang='fa'] .kpi .v { letter-spacing: 0; }
  .kpi .d { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; white-space: nowrap; }
  .up { color: var(--accent); font-weight: 600; }
  .chart { flex: 1; min-height: 0; margin-block-start: 8px; }
  .chart svg, svg.ch { width: 100%; height: 100%; display: block; direction: ltr; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-block-start: 8px; }
  th { text-align: start; color: var(--muted); font-weight: 500; padding: 7px 8px; border-block-end: 1px solid var(--border); }
  td { padding: 7px 8px; border-block-end: 1px solid var(--grid); }
  td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
  .filterbar { display: flex; align-items: center; gap: 10px; margin-block-end: 16px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; height: 34px; padding-inline: 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-weight: 500;
  }
  .chip small { color: var(--muted); font-weight: 400; }
  .title-row { display: flex; align-items: baseline; gap: 12px; margin-block-end: 14px; }
  .title-row h1 { margin: 0; font-size: 22px; }
  .title-row p { margin: 0; color: var(--muted); }

  /* edit mode */
  .edit main { grid-template-columns: 220px 1fr 340px; }
  aside { background: var(--surface); border-inline-end: 1px solid var(--border); padding: 16px; overflow: hidden; }
  aside.end { border-inline-end: 0; border-inline-start: 1px solid var(--border); }
  aside h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  [lang='fa'] aside h4 { text-transform: none; letter-spacing: 0; font-size: 13px; }
  .pal { display: grid; gap: 8px; }
  .pal div {
    display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); cursor: grab; font-weight: 500;
  }
  .pal div .grip { margin-inline-start: auto; color: var(--muted); }
  .pal div.dragging { box-shadow: 0 10px 24px rgba(0,0,0,.25); transform: rotate(-2deg); border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-block-start: 12px; }
  .edit .grid { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: calc((100% + 16px) / 12) 86px; background-position: -8px -8px; border-radius: 8px; }
  .edit .card { border-style: dashed; }
  .edit .card.sel { border: 2px solid var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .handle { position: absolute; inset-block-end: 4px; inset-inline-end: 4px; width: 12px; height: 12px; border-inline-end: 2px solid var(--muted); border-block-end: 2px solid var(--muted); border-radius: 0 0 3px 0; }
  [dir='rtl'] .handle { border-radius: 0 0 0 3px; }
  .toolbar-mini { position: absolute; inset-block-start: -15px; inset-inline-end: 10px; display: flex; gap: 2px; background: var(--accent); color: var(--accent-fg); border-radius: 6px; padding: 3px; }
  .toolbar-mini span { width: 24px; height: 22px; display: grid; place-items: center; }
  .drop { border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: var(--radius); display: grid; place-items: center; color: var(--text); font-weight: 500; }
  .tabs { display: flex; gap: 4px; border-block-end: 1px solid var(--border); margin: -4px -16px 14px; padding-inline: 16px; }
  .tabs span { padding: 8px 10px; color: var(--muted); font-weight: 500; border-block-end: 2px solid transparent; }
  .tabs span.on { color: var(--text); border-color: var(--accent); }
  .field { margin-block-end: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-block-end: 4px; font-weight: 500; }
  .input { height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding-inline: 10px; display: flex; align-items: center; justify-content: space-between; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .swatches { display: flex; gap: 6px; }
  .swatches i { width: 26px; height: 26px; border-radius: 6px; border: 2px solid transparent; }
  .swatches i.on { border-color: var(--text); }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding-block: 6px; }
  .sw { width: 34px; height: 20px; border-radius: 10px; background: var(--accent); position: relative; }
  .sw::after { content: ''; position: absolute; inset-block-start: 3px; inset-inline-end: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent-fg); }
  .sw.off { background: var(--border); }
  .sw.off::after { inset-inline-end: auto; inset-inline-start: 3px; background: var(--bg); }
  .kbd { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }

  /* query builder */
  .qb main { grid-template-columns: 260px 1fr; }
  body:has(.qb), .app.qb { min-height: 0; }
  .fields .ds { margin-block-end: 14px; }
  .fields .f { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: grab; }
  .fields .f:hover, .fields .f.dragging { background: var(--bg); }
  .fields .f.dragging { border: 1px solid var(--accent); box-shadow: 0 8px 18px rgba(0,0,0,.25); }
  .type { width: 22px; height: 20px; border-radius: 4px; font-size: 10px; font-weight: 700; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-family: Inter, sans-serif; }
  .qwrap { padding: 20px 24px; display: grid; grid-template-rows: auto auto auto; align-content: start; gap: 16px; min-height: 0; }
  .sentence { font-size: 17px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .sentence b { color: var(--accent); font-weight: 600; }
  .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .zone { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .zone h5 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding-inline: 10px; border-radius: 7px; background: var(--accent-soft); border: 1px solid var(--accent); margin-inline-end: 6px; margin-block-end: 6px; font-weight: 500; }
  .pill em { font-style: normal; color: var(--muted); font-weight: 400; }
  .pill.add { background: transparent; border-style: dashed; border-color: var(--border); color: var(--muted); }
  .pill.target { border-color: var(--accent); color: var(--text); background: transparent; border-style: dashed; border-width: 2px; }
  .preview { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; height: 420px; }
  .preview .chart { margin: 0; }
  .tcard { display: flex; flex-direction: column; min-height: 0; }
  th .s { display: inline-flex; vertical-align: -3px; margin-inline-start: 4px; opacity: .45; }
  th.sorted { color: var(--text); }
  th.sorted .s { opacity: 1; color: var(--accent); }
  .tfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); margin-block-start: auto; padding-block-start: 10px; }
  .pg { display: flex; gap: 4px; align-items: center; }
  .pg span { min-width: 26px; height: 26px; padding-inline: 4px; border: 1px solid var(--border); border-radius: 6px; display: inline-grid; place-items: center; color: var(--text); background: var(--bg); }
  .pg span.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .pg span.dis { opacity: .45; }
  .showas { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-block: 10px 4px; font-size: 12px; color: var(--muted); }
  .showas span.t { display: inline-grid; place-items: center; width: 30px; height: 28px; border: 1px solid var(--border); border-radius: 6px; color: var(--text); background: var(--bg); }
  .showas span.t.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .donut-wrap { display: flex; align-items: center; justify-content: center; gap: 20px; height: 100%; }
  .donut-leg { display: grid; gap: 8px; font-size: 13px; }
  .donut-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 8px; }
  .wh { grid-column: span 12; display: flex; flex-direction: column; justify-content: flex-end; padding-block-end: 6px; border-block-end: 1px solid var(--border); position: relative; }
  .wh h2 { margin: 0; font-size: 18px; }
  .wh p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .edit .wh { border: 1px dashed var(--border); border-radius: var(--radius); padding: 6px 14px; }
  .note { font-size: 14px; line-height: 1.7; margin-block-start: 6px; }
  .note p { margin: 0 0 8px; }
  .note ul { margin: 0 0 8px; padding-inline-start: 18px; }
  .note a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .mini svg { width: 100%; height: 100%; display: block; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
</style>
</head>

  format: (x) => {
    const a = Math.abs(x);
    if (a >= 1e6) return nf1.format(x / 1e6) + 'M';
    if (a >= 1e3) return nf1.format(x / 1e3) + 'K';
    return nf1.format(x);
  },

const n = (x) => nf.format(x);
const loc = fa ? 'fa-IR' : 'en-US';
const eur = (x) => new Intl.NumberFormat(loc, { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(x);

function lineChart(w, h, series, labels, opt = {}) {
  const yw = opt.small ? 0 : fa ? 52 : 44;
  const pad = fa ? { t: 10, r: yw, b: opt.small ? 4 : 24, l: 10 } : { t: 10, r: 10, b: opt.small ? 4 : 24, l: yw };
  const max = opt.max || 140, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const X = (i) => {
    const x = (i / (labels.length - 1)) * iw;
    return fa ? pad.l + iw - x : pad.l + x; // RTL: time flows right-to-left
  };
  const Y = (v) => pad.t + ih - (v / max) * ih;
  let s = '';
  for (let g = 0; g <= 4 && !opt.small; g++) {
    const v = (max / 4) * g, y = Y(v);
    s += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/>`;
    s += `<text x="${fa ? w - 2 : pad.l - 8}" y="${y + 4}" font-size="11" fill="var(--muted)" text-anchor="end">${cf.format(v * 1000)}</text>`;
  }
  labels.forEach((m, i) => { if (i % (opt.every || 1) === 0) s += `<text x="${X(i)}" y="${h - 6}" font-size="11" fill="var(--muted)" text-anchor="middle">${m}</text>`; });
  series.forEach((ser, k) => {
    const pts = ser.data.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
    if (opt.area && k === 0) s += `<polygon points="${X(0)},${Y(0)} ${pts} ${X(ser.data.length - 1)},${Y(0)}" fill="${ser.c}" opacity=".14"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="${ser.c}" stroke-width="${k ? 2 : 2.5}" ${ser.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>`;
    if (!ser.dash && !opt.noDots) ser.data.forEach((v, i) => (s += `<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="var(--surface)" stroke="${ser.c}" stroke-width="2"/>`));
  });
  return `<svg class="ch" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}

function barChart(w, h, vals, labels) {
  const pad = { t: 6, b: 6 }, lw = fa ? 70 : 84, max = 400, vw = fa ? 96 : 56;
  const bh = (h - pad.t - pad.b) / vals.length;
  let s = '';
  vals.forEach((v, i) => {
    const y = pad.t + i * bh, bw = ((w - lw - vw) * v) / max;
    const x0 = fa ? w - lw : lw;
    const bx = fa ? x0 - bw : x0;
    s += `<text x="${fa ? w : lw - 10}" y="${y + bh / 2 + 4}" font-size="12" fill="var(--muted)" text-anchor="end">${labels[i]}</text>`;
    s += `<rect x="${bx}" y="${y + bh * 0.18}" width="${bw}" height="${bh * 0.64}" rx="4" fill="var(--s${i === 0 ? 1 : 3})"/>`;
    s += `<text x="${fa ? bx - 8 : bx + bw + 8}" y="${y + bh / 2 + 4}" font-size="12" fill="var(--text)" text-anchor="${fa ? 'end' : 'start'}">${cf.format(v * 1000)}</text>`;
  });
  return `<svg class="ch" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}

function donut(size, vals) {
  const sw = Math.max(16, Math.round(size * 0.13));
  const r = size / 2 - sw / 2 - 2, c = size / 2, tot = vals.reduce((a, b) => a + b, 0);
  let a0 = -Math.PI / 2, s = '';
  vals.forEach((v, i) => {
    const a1 = a0 + (v / tot) * Math.PI * 2 * (fa ? -1 : 1);
    const large = Math.abs(a1 - a0) > Math.PI ? 1 : 0, sweep = fa ? 0 : 1;
    const p = (a) => `${c + r * Math.cos(a)},${c + r * Math.sin(a)}`;
    s += `<path d="M${p(a0)} A${r},${r} 0 ${large} ${sweep} ${p(a1)}" fill="none" stroke="var(--s${i + 1})" stroke-width="${sw}"/>`;
    a0 = a1;
  });
  s += `<text x="${c}" y="${c - 2}" text-anchor="middle" font-size="${size > 180 ? 20 : 16}" font-weight="700" fill="var(--text)">${eurC(998000)}</text>`;
  s += `<text x="${c}" y="${c + 16}" text-anchor="middle" font-size="11" fill="var(--muted)">${T.revenue}</text>`;
  return `<svg class="ch" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex:none">${s}</svg>`;
}

// Donut sized to its card: the ring never overflows and the legend keeps its space.
function donutCard(w, h, vals) {
  const size = Math.max(110, Math.min(h, w - 170));
  const leg = T.cats.map((t, i) => `<span><i style="background:var(--s${i + 1})"></i>${t} <b style="margin-inline-start:6px">${pct(vals[i])}</b></span>`).join('');
  return `<div class="donut-wrap">${donut(size, vals)}<div class="donut-leg">${leg}</div></div>`;
}

// Shared value axis for the vertical charts. In Persian the category axis is mirrored.
function frame(w, h, max, fmt, steps = 4) {
  const yw = fa ? 56 : 46;
  const pad = fa ? { t: 8, r: yw, b: 24, l: 8 } : { t: 8, r: 8, b: 24, l: yw };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const Y = (v) => pad.t + ih - (v / max) * ih;
  const Xf = (f) => (fa ? pad.l + iw - f * iw : pad.l + f * iw);
  let s = '';
  for (let g = 0; g <= steps; g++) {
    const v = (max / steps) * g, y = Y(v);
    s += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/>`;
    s += `<text x="${fa ? w - 2 : pad.l - 8}" y="${y + 4}" font-size="11" fill="var(--muted)" text-anchor="end">${fmt(v)}</text>`;
  }
  return { s, Y, Xf, pad, iw, ih };
}

function stackedBar(w, h) {
  const data = [[62, 70, 74, 92], [48, 52, 61, 70], [33, 38, 41, 52], [20, 22, 25, 31]];
  const f = frame(w, h, 260, (v) => cf.format(v * 1000));
  let s = f.s;
  const n4 = 4, slot = f.iw / n4, bw = Math.min(56, slot * 0.5);
  for (let i = 0; i < n4; i++) {
    const cx = f.Xf((i + 0.5) / n4);
    let acc = 0;
    data.forEach((ser, k) => {
      const y0 = f.Y(acc), y1 = f.Y(acc + ser[i]);
      s += `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${y0 - y1}" fill="var(--s${k + 1})" stroke="var(--surface)" stroke-width="1.5" rx="2"/>`;
      acc += ser[i];
    });
    s += `<text x="${cx}" y="${h - 6}" font-size="11" fill="var(--muted)" text-anchor="middle">${T.quarters[i]}</text>`;
  }
  return `<svg class="ch" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}

function scatter(w, h) {
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const f = frame(w, h, 600, (v) => eur(v));
  let s = f.s;
  for (let t = 0; t <= 40; t += 10) {
    const edge = t === 40 ? (fa ? 'start' : 'end') : t === 0 ? (fa ? 'end' : 'start') : 'middle';
    s += `<text x="${f.Xf(t / 40)}" y="${h - 6}" font-size="11" fill="var(--muted)" text-anchor="${edge}">${pct(t)}</text>`;
  }
  for (let i = 0; i < 70; i++) {
    const k = i % 4, disc = rnd() * 38, prof = Math.max(10, 520 - disc * 11 + (rnd() - 0.5) * 220 - k * 40);
    s += `<circle cx="${f.Xf(disc / 40)}" cy="${f.Y(prof)}" r="4.5" fill="var(--s${k + 1})" fill-opacity=".85" stroke="var(--surface)"/>`;
  }
  return `<svg class="ch" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}

function heatmap(w, h) {
  const days = [...Array(7)].map((_, i) => new Intl.DateTimeFormat(fa ? 'fa-IR-u-ca-gregory' : 'en-US', { weekday: fa ? 'long' : 'short' }).format(new Date(2025, 0, 6 + i)));
  const lw = fa ? 64 : 40, cols = 12, rows = 7, top = 2, bottom = 20;
  const cw = (w - lw) / cols, ch = (h - top - bottom) / rows;
  let s = '';
  for (let r = 0; r < rows; r++) {
    s += `<text x="${fa ? w - 2 : lw - 8}" y="${top + r * ch + ch / 2 + 4}" font-size="11" fill="var(--muted)" text-anchor="end">${days[r]}</text>`;
    for (let c = 0; c < cols; c++) {
      const hour = c * 2, work = r < 5 ? 1 : 0.55;
      const v = Math.max(0.04, Math.exp(-((hour - 13) ** 2) / 22) * work + (hour >= 18 && hour <= 22 ? 0.25 : 0) * (r >= 4 ? 1.2 : 0.6));
      const x = fa ? w - lw - (c + 1) * cw : lw + c * cw;
      s += `<rect x="${x + 1.5}" y="${top + r * ch + 1.5}" width="${cw - 3}" height="${ch - 3}" rx="3" fill="var(--accent)" fill-opacity="${Math.min(1, 0.1 + v * 0.9).toFixed(2)}"/>`;
    }
  }
  for (let c = 0; c < cols; c += 2) {
    const x = fa ? w - lw - c * cw - cw / 2 : lw + c * cw + cw / 2;
    s += `<text x="${x}" y="${h - 4}" font-size="11" fill="var(--muted)" text-anchor="middle">${new Intl.NumberFormat(loc, { minimumIntegerDigits: 2 }).format(c * 2)}:${fa ? '۰۰' : '00'}</text>`;
  }
  return `<svg class="ch" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}

function dataTable(cols, rows, { sorted, total, pages = 10 }) {

  const body = rows.map((r) => `<tr>${r.map((v, i) => `<td class="${cols[i].n ? 'n' : ''}" ${cols[i].m ? 'style="color:var(--muted)"' : ''}>${v}</td>`).join('')}</tr>`).join('');
  const pg = `<div class="pg"><span class="dis">${I('chevS')}</span><span class="on">${n(1)}</span><span>${n(2)}</span><span>${n(3)}</span>${pages > 3 ? `<span style="border:0;background:none">…</span><span>${n(pages)}</span>` : ''}<span>${I('chevE')}</span></div>`;
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table><div class="tfoot"><span>${T.rowsOf(n(1), n(rows.length), n(total))}${fa ? '، ' : ' · '}${T.perPage}</span>${pg}</div>`;
}

function dashboardGrid(edit) {
  const months = fa ? T.months.map((m) => m.slice(0, 4)) : T.months;
  const sel = edit ? '<div class="toolbar-mini"><span>' + I('copy') + '</span><span>' + I('trash') + '</span></div>' : '';
  const handle = edit ? '<div class="handle"></div>' : '';
  const more = edit ? '' : `<span class="more" style="color:var(--muted)">${I('more')}</span>`;
  const headingW = ([t, sub]) => `<div class="wh">${handle}<h2>${t}</h2><p>${sub}</p></div>`;
  let g = kpis.map((k) => kpiCard(k, handle)).join('');
  g += headingW(T.h1);
  g += `<div class="card ${edit ? 'sel' : ''}" style="grid-column:span ${edit ? 12 : 8};grid-row:span ${edit ? 4 : 5}">${sel}${handle}<h3>${T.byMonth}${more}</h3>${legend(['2025', '2024'])}${C((w, h) => lineChart(w, h, [{ data: revenue, c: 'var(--s1)' }, { data: prev, c: 'var(--s3)', dash: true }], months, { area: true }))}</div>`;
  if (!edit) {
    const card = (span, title, body, cls = '') => `<div class="card ${cls}" style="grid-column:span ${span};grid-row:span 5"><h3>${title}${more}</h3>${body}</div>`;
    const prodRows = T.prods.map((p) => [p[0], p[1], n(p[2]), eur(+p[3].replace(',', ''))]);
    const cumul = [8, 17, 28, 38, 50, 63, 75, 89, 104, 117, 129, 136];
    g += card(4, T.byCat, C((w, h) => donutCard(w, h, cats)));
    g += card(7, T.byCatQ, legend(T.cats) + C((w, h) => stackedBar(w, h)));
    g += card(5, T.byCountry, C((w, h) => barChart(w, h, [312, 241, 168, 131, 88, 58], T.countries)));
    g += headingW(T.h2);
    g += card(7, T.heatT, C((w, h) => heatmap(w, h)));
    g += card(5, T.scatterT, legend(T.cats) + C((w, h) => scatter(w, h)));
    g += card(4, T.areaT, C((w, h) => lineChart(w, h, [{ data: cumul, c: 'var(--s3)' }], months, { area: true, noDots: true, every: 2 })));
    g += card(5, T.top, dataTable([{ t: T.product }, { t: T.cat, m: 1 }, { t: T.qty, n: 1 }, { t: T.rev, n: 1 }], prodRows, { sorted: 3, total: 48 }), 'tcard');
    g += card(3, T.noteT, `<div class="note">${T.note}</div>`);
  } else {
    g += `<div class="card" style="grid-column:span 6;grid-row:span 3">${handle}<h3>${T.byCountry}</h3>${C((w, h) => barChart(w, h, [312, 241, 168, 131], T.countries.slice(0, 4)))}</div>`;
    g += `<div class="drop" style="grid-column:span 6;grid-row:span 3"><span>${I('plus')} ${T.dropHere}</span></div>`;
  }
  return `<div class="grid">${g}</div>`;
}

function viewDashboard() {
  return `<div class="app">${header('view')}<main><div class="canvas">
    <div class="title-row"><h1>${T.dash}</h1><p>${T.sub}</p></div>
    <div class="filterbar"><span class="chip">${I('cal')}<small>${T.range}</small>${T.rangeV}${I('down')}</span></div>
    ${dashboardGrid(false)}</div></main></div>`;
}

function viewEdit() {
  const pal = [['kpi', T.kpi], ['line', T.line], ['area', T.areaChart], ['bar', T.bar], ['stack', T.stacked], ['pie', T.pie], ['scatter', T.scatter], ['heat', T.heatmap], ['heading', T.headingW], ['text', T.textW], ['table', T.table]];
  const months = fa ? T.months.map((m) => m.slice(0, 4)) : T.months;
  return `<div class="app edit">${header('edit')}<main>
    <aside><h4>${T.widgets}</h4><div class="pal">${pal.map(([k, t]) => `<div class="${k === 'bar' ? 'dragging' : ''}">${I(k)}${t}<span class="grip">${I('grip')}</span></div>`).join('')}</div><p class="hint">${T.dragHint}</p></aside>
    <div class="canvas"><div class="filterbar"><span class="chip">${I('cal')}<small>${T.range}</small>${T.rangeV}${I('down')}</span></div>${dashboardGrid(true)}</div>
    <aside class="end">
      <h4>${T.settings}</h4>
      <div class="tabs"><span>${T.tQuery}</span><span class="on">${T.tDisplay}</span><span>${T.tFormat}</span></div>
      <div class="field"><label>${T.title}</label><div class="input">${T.byMonth}</div></div>
      <div class="row2"><div class="field"><label>${T.xAxis}</label><div class="input"><span>${T.xV}</span>${I('down')}</div></div>
      <div class="field"><label>${T.yAxis}</label><div class="input"><span>${T.yV}</span>${I('down')}</div></div></div>
      <div class="field"><label>${T.color}</label><div class="swatches">${[1, 2, 3, 4, 5].map((i) => `<i class="${i === 1 ? 'on' : ''}" style="background:var(--s${i})"></i>`).join('')}</div></div>
      <div class="field"><label>${T.numFmt}</label><div class="input"><span>${T.numV}</span>${I('down')}</div></div>
      <div class="toggle"><span>${T.legend}</span><span class="sw"></span></div>
      <div class="toggle"><span>${T.smooth}</span><span class="sw off"></span></div>
      <div class="toggle"><span>${T.area}</span><span class="sw"></span></div>
      <div class="toggle"><span>${T.labels}</span><span class="sw off"></span></div>
      <div style="display:flex;gap:8px;margin-block-start:14px"><button class="btn" style="flex:1;justify-content:center">${I('sigma')}${T.editQuery}</button></div>
      <div class="field" style="margin-block-start:16px"><label>${T.tDisplay} · ${T.line}</label>${C((w, h) => lineChart(w, h, [{ data: revenue, c: 'var(--s1)' }], months.map(() => ''), { area: true, small: true }), 'mini', 'height:90px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px')}</div>
    </aside>
  </main></div>`;
}

function viewQB() {
  const F = [['D', T.fOrderDate], ['A', T.fCountry], ['A', T.fCategory], ['A', T.fProduct], ['#', T.fRevenue], ['#', T.fQty], ['#', T.fProfit], ['%', T.fDiscount]];
  const s = T.sent;
  const months = fa ? T.months.map((m) => m.slice(0, 4)) : T.months;
  const de = [21, 19, 24, 23, 26, 28, 27, 29, 31, 30, 34, 39];
  const rowsQ = [11, 10, 9, 8, 7].map((i) => [`${T.months[i]} ${d(2025)}`, eur(de[i] * 1000 + 412), n(Math.round(de[i] * 8.4))]);
  return `<div class="app qb">${header('qb')}<main>
    <aside class="fields">
      <h4>${T.datasets}</h4>
      <div class="input ds"><span style="display:flex;gap:8px;align-items:center">${I('db')}${T.ds1}</span>${I('down')}</div>
      <div class="input ds" style="color:var(--muted)"><span style="display:flex;gap:8px;align-items:center">${I('search')}${T.search}</span></div>
      <h4>${T.fieldsT}</h4>
      ${F.map(([t, l]) => `<div class="f ${l === T.fCategory ? 'dragging' : ''}"><span class="type">${t}</span>${l}<span style="margin-inline-start:auto;color:var(--muted)">${I('grip')}</span></div>`).join('')}
      <button class="btn" style="margin-block-start:14px;width:100%;justify-content:center">${I('upload')}CSV</button>
    </aside>
    <div class="qwrap">
      <div class="sentence">${s[0]}<b>${s[1]}</b>${s[2]}<b>${s[3]}</b>${s[4]}<b>${s[5]}</b>${s[6]}<b>${s[7]}</b>${s[8]}</div>
      <div class="zones">
        <div class="zone"><h5>${I('sigma')}${T.measures}</h5><span class="pill">${T.sum} ${T.of} ${T.fRevenue}${I('down')}${I('x')}</span><span class="pill">${T.count} ${T.of} ${T.orders}${I('down')}${I('x')}</span><span class="pill add">${I('plus')}${T.addMeasure}</span></div>
        <div class="zone"><h5>${I('layers')}${T.groupBy}</h5><span class="pill">${T.fOrderDate} <em>${T.byMonthP}</em>${I('down')}${I('x')}</span><span class="pill target">${I('plus')}${T.addGroup}</span></div>
        <div class="zone"><h5>${I('filter')}${T.filters}</h5><span class="pill">${T.fCountry} <em>${T.is}</em> ${T.countries[0]}${I('x')}</span><span class="pill add">${I('plus')}${T.addFilter}</span></div>
        <div class="zone"><h5>${I('sort')}${T.sortLimit}</h5><span class="pill">${T.sortV}${I('down')}</span><span class="pill">${T.limitV}${I('down')}</span></div>
      </div>
      <div class="preview">
        <div style="display:flex;flex-direction:column;min-height:0">
          <div style="display:flex;justify-content:space-between;align-items:center"><b>${T.preview}</b><span class="meta"><span>${T.rows}</span><span>${T.ms}</span><span>${T.cached}</span></span></div>
          <div class="showas">${T.showAs}${['line', 'area', 'bar', 'stack', 'kpi', 'table'].map((k) => `<span class="t ${k === 'area' ? 'on' : ''}">${I(k)}</span>`).join('')}</div>
          ${C((w, h) => lineChart(w, h, [{ data: de.map((v) => v * 3.2), c: 'var(--s1)' }], months, { area: true }))}
        </div>
        <div class="tcard">${dataTable([{ t: T.month }, { t: T.fRevenue, n: 1 }, { t: T.orders, n: 1 }], rowsQ, { sorted: 0, total: 12, pages: 3 })}</div>
      </div>
    </div>
  </main></div>`;
}

document.getElementById('root').innerHTML = view === 'edit' ? viewEdit() : view === 'query' ? viewQB() : viewDashboard();
document.querySelectorAll('[data-c]').forEach((el) => {
  const r = el.getBoundingClientRect();
  const cs = getComputedStyle(el);
  const w = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  el.innerHTML = charts[el.dataset.c](Math.floor(w), Math.floor(h));
});
</script>
</body>
