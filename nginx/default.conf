# Nginx inside the container: serves the static build (dist). The host Nginx in front
# of it terminates TLS (deploy/nginx.conf).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # behind a proxy the host name in redirects would be wrong; keep them relative
    absolute_redirect off;

    # Files were gzipped at build time (Dockerfile): send the .gz copy when the
    # browser accepts it, so nothing is compressed per request.
    gzip_static on;
    gzip_vary on;

    # The app only ever needs GET/HEAD.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles or source maps.
    location ~ /\.      { return 404; }
    location ~ \.map$   { return 404; }

    # Hashed build output (JS, CSS, fonts, DuckDB worker and wasm): cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Sample datasets: not hashed, so a long but not immutable cache.
    location /data/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
