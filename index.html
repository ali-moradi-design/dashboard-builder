<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Build dashboards from data without code. Queries run in your browser."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Dashboard builder</title>
    <!-- Applies the saved theme and language before the first paint (no flash). -->
    <script src="/boot.js"></script>
    <style>
      /* Shown until the app's code has loaded; React replaces it. */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fdfdff;
      }
      [data-theme='dark'] .boot {
        background: #2a2d2f;
      }
      .boot::after {
        content: '';
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgb(98 146 158 / 0.25);
        border-top-color: #62929e;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot::after {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"></div></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
